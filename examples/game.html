<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reach sample game</title><style>
body{font:18px system-ui;max-width:48rem;margin:3rem auto;padding:0 1rem;background:#101e2c;color:#f5f7fa}main{background:#233b50;padding:2rem;border-radius:1rem}h1{font-size:2rem}button{font:inherit;padding:.7rem 1rem;border-radius:.4rem;border:0;background:#ffdd80;color:#102033}#state{font-size:1.5rem;font-weight:bold}small{color:#cddce8}
</style></head><body><main><h1>Lantern Path</h1><p>A small synthetic game for testing Reach.</p><p id="state" role="status">menu</p><p id="instructions"></p><button id="action">Start</button><p><small>Keyboard: Enter to start/finish, Escape to pause, R to recover. Single-action: Space at each step. The seed chooses the lantern color.</small></p></main><script>
const params = new URLSearchParams(location.search); const fault = params.get('fault'); const profile = params.get('profile'); const seed = Number(params.get('seed') || 0); let state = 'menu'; const stateEl=document.querySelector('#state'), button=document.querySelector('#action'), instructions=document.querySelector('#instructions');
function render(){stateEl.textContent=state; document.body.dataset.checkpoint=state; instructions.textContent=({menu:'Start the path.',play:'Pause before continuing.',pause:'Recover from the pause.',recover:'Finish the path.',finish:'Journey complete.'})[state]; button.textContent=({menu:'Start',play:'Pause',pause:'Recover',recover:'Finish',finish:'Finished'})[state]; button.disabled=state==='finish'; document.querySelector('main').style.borderLeft=`8px solid ${seed % 2 ? '#a7dfc1' : '#ffdd80'}`;}
function step(){if(state==='menu' && fault!=='trap')state='play'; else if(state==='play' && fault!=='unpausable')state='pause'; else if(state==='pause')state='recover'; else if(state==='recover' && !(fault==='held-only' && profile==='single-action'))state='finish';render();}
button.addEventListener('click',step);
document.addEventListener('keydown',e=>{if(e.repeat)return; const key=profile==='single-action' ? ' ' : ({menu:'Enter',play:'Escape',pause:'r',recover:'Enter'})[state]; if(e.key===key){e.preventDefault(); step();}});render();
</script></body></html>
